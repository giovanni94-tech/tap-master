<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Tap Master</title>

<style>

/* =========================
   BASE
   ========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    min-height: 100vh;
    min-height: 100dvh;

    background:
        radial-gradient(
            circle at top,
            #292060,
            transparent 45%
        ),
        linear-gradient(
            160deg,
            #080b1c,
            #160b36
        );

    color: white;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    touch-action: manipulation;
}


/* =========================
   CONTENITORE PRINCIPALE
   ========================= */

.game {

    width: 100%;
    max-width: 500px;

    height: 100dvh;

    padding:
        8px 15px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}


/* =========================
   TITOLO
   ========================= */

h1 {

    margin:
        0 0 2px;

    font-size:
        clamp(27px, 8vw, 36px);

    letter-spacing:
        2px;
}

.subtitle {

    color:
        #aaa9c7;

    font-size:
        14px;

    margin-bottom:
        8px;
}


/* =========================
   MONETE
   ========================= */

.coinCounter {

    display:
        inline-block;

    background:
        rgba(255,255,255,0.09);

    border:
        1px solid
        rgba(255,255,255,0.1);

    border-radius:
        20px;

    padding:
        5px 13px;

    margin-bottom:
        8px;

    font-size:
        16px;

    font-weight:
        bold;
}


/* =========================
   STATISTICHE
   ========================= */

.stats {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        7px;

    width:
        min(330px, 90vw);

    margin-bottom:
        8px;
}

.stat {

    background:
        rgba(255,255,255,0.09);

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius:
        13px;

    padding:
        6px 5px;
}

.stat-title {

    font-size:
        10px;

    color:
        #aaa9c7;
}

.stat-value {

    font-size:
        19px;

    font-weight:
        bold;

    margin-top:
        2px;
}


/* =========================
   AREA TAP
   ========================= */

#tapArea {

    position:
        relative;

    width:
        220px;

    height:
        220px;

    margin:
        3px auto;
}


/* =========================
   PULSANTE TAP
   ========================= */

#tapButton {

    position:
        absolute;

    width:
        200px;

    height:
        200px;

    left:
        10px;

    top:
        10px;

    border-radius:
        50%;

    border:
        none;

    background:
        linear-gradient(
            145deg,
            #00ff9d,
            #00aaff
        );

    color:
        #06121b;

    font-size:
        34px;

    font-weight:
        900;

    box-shadow:
        0 0 25px
        rgba(0,255,170,0.5),

        0 12px 40px
        rgba(0,170,255,0.25);

    touch-action:
        manipulation;

    cursor:
        pointer;

    transition:
        transform 0.08s;
}

#tapButton:active {

    transform:
        scale(0.92);
}


/* =========================
   ANIMAZIONE TAP
   ========================= */

.pulse {

    animation:
        pulse
        0.20s
        ease-out;
}

@keyframes pulse {

    0% {

        box-shadow:
            0 0 25px
            rgba(0,255,170,0.5),

            0 12px 40px
            rgba(0,170,255,0.25);
    }

    50% {

        box-shadow:
            0 0 65px
            rgba(0,255,170,1),

            0 0 90px
            rgba(0,170,255,0.7);
    }

    100% {

        box-shadow:
            0 0 25px
            rgba(0,255,170,0.5),

            0 12px 40px
            rgba(0,170,255,0.25);
    }
}


/* =========================
   COMBO
   ========================= */

#combo {

    height:
        27px;

    margin-top:
        0;

    font-size:
        20px;

    font-weight:
        bold;

    color:
        #ffcc00;
}


/* =========================
   BARRA COMBO
   ========================= */

.combo-container {

    width:
        220px;

    height:
        7px;

    margin:
        2px auto 0;

    background:
        rgba(255,255,255,0.12);

    border-radius:
        20px;

    overflow:
        hidden;
}

#comboBar {

    width:
        0%;

    height:
        100%;

    background:
        linear-gradient(
            90deg,
            #00ff9d,
            #00aaff,
            #ffcc00
        );

    border-radius:
        20px;

    transition:
        width 0.05s linear;
}


/* =========================
   MESSAGGIO
   ========================= */

#message {

    min-height:
        25px;

    margin-top:
        7px;

    font-size:
        15px;

    color:
        #d9d8f0;
}


/* =========================
   PULSANTI
   ========================= */

.actionButton {

    margin:
        5px auto;

    padding:
        10px 24px;

    border:
        none;

    border-radius:
        12px;

    font-size:
        16px;

    font-weight:
        bold;

    touch-action:
        manipulation;
}

#startButton {

    display:
        none;

    background:
        linear-gradient(
            135deg,
            #ffcc00,
            #ff9500
        );

    color:
        #171000;
}

#shopButton {

    background:
        linear-gradient(
            135deg,
            #8e5cff,
            #c03cff
        );

    color:
        white;
}


/* =========================
   NEGOZIO
   ========================= */

#shopScreen {

    display:
        none;

    position:
        fixed;

    inset:
        0;

    z-index:
        100;

    overflow-y:
        auto;

    padding:
        15px;

    background:
        radial-gradient(
            circle at top,
            #35256d,
            transparent 45%
        ),
        linear-gradient(
            160deg,
            #080b1c,
            #160b36
        );
}

.shopContent {

    width:
        100%;

    max-width:
        500px;

    margin:
        auto;

    text-align:
        center;
}

.shopTitle {

    font-size:
        30px;

    font-weight:
        bold;

    margin-bottom:
        5px;
}

.shopCoins {

    font-size:
        18px;

    margin-bottom:
        12px;
}

.skinGrid {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        9px;
}


/* =========================
   SKIN CARD
   ========================= */

.skin {

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255,0.1);

    border-radius:
        15px;

    padding:
        10px 8px;
}

.skinName {

    font-size:
        16px;

    font-weight:
        bold;

    margin-bottom:
        6px;
}

.skinPreview {

    width:
        65px;

    height:
        65px;

    margin:
        4px auto 8px;

    border-radius:
        50%;
}

.skinButton {

    width:
        100%;

    padding:
        8px;

    border:
        none;

    border-radius:
        9px;

    background:
        #25233b;

    color:
        white;

    font-size:
        13px;

    font-weight:
        bold;
}

.skinButton.selected {

    background:
        #00b978;
}

.skinButton.buy {

    background:
        #ffb900;

    color:
        #201800;
}


/* =========================
   CHIUDI NEGOZIO
   ========================= */

#closeShopButton {

    margin-top:
        15px;

    padding:
        11px 27px;

    border:
        none;

    border-radius:
        11px;

    background:
        #333047;

    color:
        white;

    font-size:
        16px;

    font-weight:
        bold;
}


/* =========================
   MONETA
   ========================= */

.coin {

    position:
        fixed;

    font-size:
        24px;

    pointer-events:
        none;

    animation:
        coinAnimation
        0.8s
        ease-out
        forwards;
}

@keyframes coinAnimation {

    0% {

        transform:
            translateY(0)
            scale(1);

        opacity:
            1;
    }

    100% {

        transform:
            translateY(-100px)
            scale(1.5);

        opacity:
            0;
    }
}


/* =========================
   SCHERMI MOLTO BASSI
   ========================= */

@media (
    max-height: 700px
) {

    h1 {
        font-size: 28px;
    }

    .subtitle {
        margin-bottom: 4px;
    }

    .coinCounter {
        margin-bottom: 5px;
    }

    .stats {
        margin-bottom: 3px;
    }

    #tapArea {
        width: 185px;
        height: 185px;
    }

    #tapButton {
        width: 165px;
        height: 165px;
        font-size: 30px;
    }

    .combo-container {
        width: 190px;
    }

    #message {
        margin-top: 4px;
    }

    .actionButton {
        margin: 3px auto;
        padding: 8px 20px;
    }
}

</style>

</head>

<script>


/* =========================
   DATI
   ========================= */

let score = 0;

let coins =
    Number(
        localStorage.getItem("coins")
    ) || 0;

let best =
    Number(
        localStorage.getItem("best")
    ) || 0;

let time = 30;

let combo = 0;

let playing = false;

let gameStarted = false;

let timer = null;

let comboTimer = null;

let selectedSkin =
    localStorage.getItem(
        "selectedSkin"
    ) || "neon";


/* =========================
   SKIN
   ========================= */

const skins = {

    neon: {
        cost: 0,
        background:
            "linear-gradient(145deg,#00ff9d,#00aaff)"
    },

    ocean: {
        cost: 100,
        background:
            "linear-gradient(145deg,#008cff,#0050ff)"
    },

    purple: {
        cost: 250,
        background:
            "linear-gradient(145deg,#d000ff,#6c00ff)"
    },

    fire: {
        cost: 500,
        background:
            "linear-gradient(145deg,#ff3b00,#ffcc00)"
    },

    gold: {
        cost: 1000,
        background:
            "linear-gradient(145deg,#fff36a,#ff9d00)"
    },

    rainbow: {
        cost: 2000,
        background:
            "linear-gradient(135deg,red,orange,yellow,lime,cyan,blue,violet)"
    }

};


/* =========================
   ELEMENTI
   ========================= */

const tapButton =
    document.getElementById(
        "tapButton"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const shopButton =
    document.getElementById(
        "shopButton"
    );

const closeShopButton =
    document.getElementById(
        "closeShopButton"
    );

const shopScreen =
    document.getElementById(
        "shopScreen"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const timeText =
    document.getElementById(
        "time"
    );

const coinsText =
    document.getElementById(
        "coins"
    );

const shopCoins =
    document.getElementById(
        "shopCoins"
    );

const comboText =
    document.getElementById(
        "combo"
    );

const comboBar =
    document.getElementById(
        "comboBar"
    );

const message =
    document.getElementById(
        "message"
    );


/* =========================
   MONETE
   ========================= */

function updateCoins() {

    coinsText.textContent =
        coins;

    shopCoins.textContent =
        coins;
}

updateCoins();


/* =========================
   SKIN
   ========================= */

function applySkin() {

    tapButton.style.background =
        skins[selectedSkin].background;
}

applySkin();


/* =========================
   TAP
   ========================= */

function handleTap(event) {

    event.preventDefault();


    if (!gameStarted) {

        startGame();

        return;
    }


    if (!playing) {

        return;
    }


    const now =
        Date.now();


    const lastTap =
        Number(
            tapButton.dataset.lastTap
        ) || 0;


    const difference =
        now - lastTap;


    if (
        lastTap > 0 &&
        difference > 700
    ) {

        combo = 0;

    }


    tapButton.dataset.lastTap =
        now;


    combo++;


    let multiplier = 1;


    if (combo >= 5) {
        multiplier = 2;
    }

    if (combo >= 15) {
        multiplier = 3;
    }

    if (combo >= 30) {
        multiplier = 4;
    }

    if (combo >= 50) {
        multiplier = 5;
    }


    score += multiplier;


    scoreText.textContent =
        score;


    comboText.textContent =
        "🔥 COMBO x" +
        combo +
        "  +" +
        multiplier;


    if (
        combo % 5 === 0
    ) {

        coins++;


        localStorage.setItem(
            "coins",
            coins
        );


        updateCoins();


        createCoin(
            event.clientX,
            event.clientY
        );

    }


    startComboTimer();


    tapButton.classList.remove(
        "pulse"
    );


    void tapButton.offsetWidth;


    tapButton.classList.add(
        "pulse"
    );

}


/* =========================
   TIMER COMBO
   ========================= */

function startComboTimer() {

    clearInterval(
        comboTimer
    );


    const start =
        Date.now();


    comboBar.style.width =
        "100%";


    comboTimer =
        setInterval(
            function() {

                const elapsed =
                    Date.now() -
                    start;


                const remaining =
                    Math.max(
                        0,
                        700 - elapsed
                    );


                const percentage =
                    (
                        remaining / 700
                    ) * 100;


                comboBar.style.width =
                    percentage + "%";


                if (
                    remaining <= 0
                ) {

                    clearInterval(
                        comboTimer
                    );


                    combo = 0;


                    comboText.textContent =
                        "💨 COMBO PERSA";


                    comboBar.style.width =
                        "0%";

                }

            },
            20
        );

}


/* =========================
   MONETA ANIMATA
   ========================= */

function createCoin(x, y) {

    const coin =
        document.createElement(
            "div"
        );


    coin.className =
        "coin";


    coin.textContent =
        "🪙";


    coin.style.left =
        x + "px";


    coin.style.top =
        y + "px";


    document.body.appendChild(
        coin
    );


    setTimeout(
        function() {

            coin.remove();

        },
        800
    );

}


/* =========================
   INIZIA PARTITA
   ========================= */

function startGame() {

    score = 0;

    time = 30;

    combo = 0;

    playing = true;

    gameStarted = true;


    tapButton.dataset.lastTap =
        "0";


    scoreText.textContent =
        "0";


    timeText.textContent =
        "30";


    comboText.textContent =
        "";


    comboBar.style.width =
        "0%";


    message.textContent =
        "🔥 Mantieni il ritmo!";


    startButton.style.display =
        "none";


    shopButton.style.display =
        "none";


    clearInterval(
        timer
    );


    clearInterval(
        comboTimer
    );


    timer =
        setInterval(
            function() {

                time--;

                timeText.textContent =
                    time;


                if (
                    time === 20
                ) {

                    message.textContent =
                        "⚡ Continua!";

                }


                if (
                    time === 10
                ) {

                    message.textContent =
                        "🔥 ULTIMI 10 SECONDI!";

                }


                if (
                    time <= 0
                ) {

                    endGame();

                }

            },
            1000
        );

}


/* =========================
   FINE PARTITA
   ========================= */

function endGame() {

    playing = false;


    clearInterval(
        timer
    );


    clearInterval(
        comboTimer
    );


    combo = 0;


    comboBar.style.width =
        "0%";


    if (
        score > best
    ) {

        best = score;


        localStorage.setItem(
            "best",
            best
        );


        message.textContent =
            "🏆 NUOVO RECORD! " +
            score +
            " PUNTI!";

    } else {

        message.textContent =
            "🎉 Hai fatto " +
            score +
            " punti!";

    }


    comboText.textContent =
        "🏆 Record: " +
        best;


    startButton.style.display =
        "block";


    shopButton.style.display =
        "block";

}


/* =========================
   GIOCA ANCORA
   ========================= */

startButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        startGame();

    },
    {
        passive: false
    }
);


/* =========================
   NEGOZIO
   ========================= */

shopButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        shopScreen.style.display =
            "block";

        updateShop();

    },
    {
        passive: false
    }
);


closeShopButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        shopScreen.style.display =
            "none";

    },
    {
        passive: false
    }
);


/* =========================
   ACQUISTA / SELEZIONA
   ========================= */

function buyOrSelectSkin(name) {

    const skin =
        skins[name];


    const owned =
        localStorage.getItem(
            "skin_" + name
        ) === "true";


    if (
        owned ||
        name === "neon"
    ) {

        selectedSkin =
            name;


        localStorage.setItem(
            "selectedSkin",
            selectedSkin
        );


        applySkin();

        updateShop();

        return;
    }


    if (
        coins < skin.cost
    ) {

        alert(
            "Non hai abbastanza monete! 🪙"
        );

        return;
    }


    coins -= skin.cost;


    localStorage.setItem(
        "coins",
        coins
    );


    localStorage.setItem(
        "skin_" + name,
        "true"
    );


    selectedSkin =
        name;


    localStorage.setItem(
        "selectedSkin",
        selectedSkin
    );


    applySkin();

    updateCoins();

    updateShop();

}


/* =========================
   AGGIORNA NEGOZIO
   ========================= */

function updateShop() {

    const names = [
        "neon",
        "ocean",
        "purple",
        "fire",
        "gold",
        "rainbow"
    ];


    names.forEach(
        function(name) {

            const id =
                "skin" +
                name.charAt(0).toUpperCase() +
                name.slice(1);


            const button =
                document.getElementById(
                    id
                );


            if (!button) {
                return;
            }


            const owned =
                localStorage.getItem(
                    "skin_" + name
                ) === "true";


            if (
                name === "neon" ||
                owned
            ) {

                if (
                    selectedSkin === name
                ) {

                    button.textContent =
                        "✓ EQUIPAGGIATA";

                    button.className =
                        "skinButton selected";

                } else {

                    button.textContent =
                        "EQUIPAGGIA";

                    button.className =
                        "skinButton";

                }

            } else {

                button.textContent =
                    "🪙 " +
                    skins[name].cost;

                button.className =
                    "skinButton buy";

            }

        }
    );


    updateCoins();

}
